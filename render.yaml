services:
  - type: web
    name: vortex
    runtime: node
    region: singapore        # closest free region for India
    plan: free
    buildCommand: npm install && cd server && npm install
    startCommand: npm start && npm run dev
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      
